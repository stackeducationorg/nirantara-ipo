# Reverse proxy for the Nirantara API.
#
# certbot rewrites this file in place when it issues the certificate, adding the
# listen 443 / ssl_certificate lines and the HTTP redirect. What is here is the
# pre-certificate state plus the settings certbot will not touch.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Never advertise the nginx version.
    server_tokens off;

    # The API returns JSON and proxied images; compressing both is worth it on a
    # free tier where egress is metered.
    gzip on;
    gzip_types application/json application/javascript text/plain image/svg+xml;
    gzip_min_length 512;

    # Registrar sweeps across many PANs can take a while before the first byte.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Without these the app's rate limiter would see every request as coming
        # from 127.0.0.1 and throttle all users as one.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The Android build, served straight off disk rather than through Node — a 65MB
    # download has no business occupying an API worker. always on the header so it
    # is sent with the 304 as well as the 200.
    location /download/ {
        alias /opt/nirantara/downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control 'public, max-age=300' always;
        autoindex off;
    }

    # Proxied logo thumbnails are immutable in practice; cache them hard so they
    # do not eat the free egress allowance on every page view.
    location /api/media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Health checks should not fill the access log.
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
}
