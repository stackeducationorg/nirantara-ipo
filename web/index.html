<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Track live IPO grey market premium, price bands and subscription figures. Save your PANs once and every one of them is checked automatically the moment allotment is out."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.nirantara.cloud/" />

    <!--
      Baseline social/search metadata. src/seo.ts overwrites these per route once React
      mounts; these values are what a crawler or link unfurler sees if it never runs JS.
    -->
    <meta property="og:site_name" content="Nirantara IPO" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nirantara.cloud/" />
    <meta property="og:title" content="Nirantara IPO — Live GMP, IPO Calendar & Allotment Check" />
    <meta
      property="og:description"
      content="Live IPO grey market premium, price bands and subscription figures, with allotment checked automatically across every PAN you save."
    />
    <meta property="og:image" content="https://www.nirantara.cloud/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
    <title>Nirantara IPO — Live GMP, IPO Calendar &amp; Automatic Allotment Check</title>
    <script>
      // Apply the stored theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('niranthar.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0a0a0b' : '#ffffff');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
