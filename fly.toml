# Fly.io deployment for the Nirantara IPO API.
#
# Two settings here are load-bearing:
#   - the mounted volume, because SQLite holds every PAN, account and money record
#   - min_machines_running = 1, because the allotment watcher and GMP sync are cron jobs
#     inside the process. If Fly stops the machine to save money, they stop running.

app = "nirantara-api"
primary_region = "bom"          # Mumbai — closest to the registrars and to your users

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATA_DIR = "/data"
  ENABLE_JOBS = "true"
  # Chromium is present in the image. Set to "false" to run leaner; per-PAN KFin and
  # Bigshare lookups keep working, only the KFin issue list stops refreshing.
  ENABLE_BROWSER_REGISTRARS = "true"
  BROWSER_HEADLESS = "true"

[[mounts]]
  source = "nirantara_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true            # solves the mixed-content problem with the Vercel frontend
  auto_stop_machines = false    # never suspend: cron jobs must keep ticking
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  # Chromium needs real memory; 256MB is not enough to launch it reliably.
  size = "shared-cpu-1x"
  memory = "1gb"
